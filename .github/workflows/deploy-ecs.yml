on:
  push:
    branches:
      - feature/ci-cd

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and push to ECR
    outputs:
      image: ${{ steps.build-and-push.outputs.image }}

    steps:
      - uses: actions/checkout@v2
      - name: configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to Amazon ECR
        id: build-and-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: easy-url-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_TAG=$IMAGE_TAG ECR_REGISTRY=$ECR_REGISTRY APP_PORT=3001 docker compose build
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:qa-$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:qa-$IMAGE_TAG" >> $GITHUB_OUTPUT
